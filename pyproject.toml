[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portfoy-cli"
version = "1.0.0"
description = "TEFAS yatırım fonu portföyü takip ve raporlama aracı"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "pandas>=2.1.0",
    "openpyxl>=3.1.2",
    "matplotlib>=3.8.0",
    "rich>=13.7.0",
    "tefas-crawler>=0.3.4",
]

[project.optional-dependencies]
# SMTP sifresini macOS Anahtar Zinciri'nde saklar; yoksa ortam degiskeni kullanilir.
keyring = ["keyring>=25.0.0"]
# Web arayuzu (`portfoy web`). Yalnizca terminalden kullananlar kurmak
# zorunda kalmasin diye opsiyonel; cmd_web eksikse kurulum komutunu yazar.
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]
# Testler: web testleri `portfoy-cli[web]` de kurulu degilse atlanir.
test = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Gercek veri dosyalarina dokunulmasin diye testler kendi gecici dosyalariyla
# calisir (bkz. tests/conftest.py); ek bir yapilandirma gerekmiyor.
addopts = "-q"

[project.scripts]
portfoy = "portfoy.cli:main"

[tool.setuptools]
# Yalnizca paket kurulur. veri/ ve ciktilar/ depoda kalir: config.BASE_DIR
# portfoy/config.py'nin konumundan turedigi icin komut nereden calistirilirsa
# calistirilsin ayni portfoy dosyasi ve ayni cikti klasoru kullanilir.
packages = ["portfoy", "portfoy.web"]

[tool.setuptools.package-data]
# Sablonlar ve stil dosyasi Python kaynagi degil; acikca belirtilmezse
# kurulan pakette bulunmaz ve `portfoy web` sablon bulamayip patlar.
"portfoy.web" = ["templates/*.html", "static/*.css"]
